<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini-S1 智能硬件热点配网</title>
  <style>
    :root {
      --bg: #080c14;
      --card: #101726;
      --border: #1c2a44;
      --accent: #00e5ff;
      --accent-sub: #00ff88;
      --text: #e6edf3;
      --muted: #8b9eb5;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      max-width: 440px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-sub));
      border-radius: 16px 16px 0 0;
    }
    h1 {
      color: var(--accent);
      font-size: 20px;
      margin: 0 0 6px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 16px;
      text-align: center;
    }
    .scan-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .scan-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .scan-btn {
      background: #182842;
      border: 1px solid #233b63;
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .scan-btn:hover {
      background: #22375a;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 12px;
      display: block;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090d16;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      outline: none;
    }
    .wifi-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .wifi-badge {
      background: #0a0f1c;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #c0d2e8;
      transition: 0.2s;
    }
    .wifi-badge:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #131d30;
    }
    button.submit-btn {
      width: 100%;
      background: var(--accent);
      color: #04060a;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s;
    }
    button.submit-btn:hover {
      background: #33ebff;
      transform: translateY(-1px);
    }
    .tip {
      background: #0c1422;
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      margin-top: 16px;
      border-radius: 6px;
      font-size: 12px;
      color: #a0b4cc;
      line-height: 1.5;
    }
    .status-pill {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #182842;
      color: var(--accent-sub);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>📡 Gemini-S1 硬件热点配网</h1>
    <p>设备处于 SoftAP 独立热点模式。请搜索并选择周边 Wi-Fi 连入网络；联网后可在控制中心或伴侣看板中自由配置 Agent 模型与桌面玩法。</p>

    <div class="scan-bar">
      <span class="scan-title">📶 周边 Wi-Fi 热点</span>
      <button class="scan-btn" onclick="scanWifi()">🔄 刷新扫描</button>
    </div>

    <select id="wifiSelect" onchange="onSelectChange()">
      <option value="">⏳ 正在搜索周边 Wi-Fi...</option>
    </select>

    <div class="wifi-badges" id="quickList"></div>

    <div id="manualBox" style="display:none;">
      <label>手动输入 SSID:</label>
      <input id="ssid" type="text" placeholder="输入无线网络名称 (SSID)">
    </div>

    <label>Wi-Fi 密码 (PSK):</label>
    <input id="psk" type="password" placeholder="请输入密码 (开放网络留空)">
    <div id="authTip" style="font-size:11px; color:#00ff88; margin-top:4px; display:none;"></div>

    <button class="submit-btn" onclick="connectWifi()">🚀 保存凭证并连接 Wi-Fi</button>

    <div class="tip" id="msg">
      💡 连接后设备将切换并获取局域网 IP。请将手机/电脑连入同一 Wi-Fi，访问小屏顶部显示的 IP 即可打开极客伴侣看板配置 Agent。
    </div>
  </div>

  <script>
    let scanData = [];

    function scanWifi() {
      const sel = document.getElementById('wifiSelect');
      sel.innerHTML = '<option value="">⏳ 正在搜索周边 Wi-Fi...</option>';
      document.getElementById('quickList').innerHTML = '';

      fetch('/api/wifi/scan').then(r => r.json()).then(d => {
        scanData = d.aps || [];
        sel.innerHTML = '';
        const qk = document.getElementById('quickList');

        if (scanData.length === 0) {
          sel.innerHTML = '<option value="__manual__">未搜到热点 - 手动输入 SSID</option>';
          return;
        }

        sel.innerHTML = '<option value="">-- 请选择 Wi-Fi 热点 (' + scanData.length + '个可用) --</option>';
        scanData.forEach(ap => {
          const opt = document.createElement('option');
          opt.value = ap.ssid;
          opt.text = '📶 ' + ap.ssid + ' (' + ap.rssi + 'dBm · ' + ap.auth + ')';
          sel.appendChild(opt);

          const bd = document.createElement('div');
          bd.className = 'wifi-badge';
          bd.innerHTML = '📶 ' + ap.ssid + ' <span class="status-pill">' + ap.auth + '</span>';
          bd.onclick = () => {
            sel.value = ap.ssid;
            onSelectChange();
          };
          qk.appendChild(bd);
        });

        const mOpt = document.createElement('option');
        mOpt.value = '__manual__';
        mOpt.text = '➕ 手动输入隐藏 Wi-Fi...';
        sel.appendChild(mOpt);
      }).catch(e => {
        sel.innerHTML = '<option value="__manual__">扫描失败 - 手动输入 SSID</option>';
      });
    }

    function onSelectChange() {
      const val = document.getElementById('wifiSelect').value;
      const mb = document.getElementById('manualBox');
      const tip = document.getElementById('authTip');

      if (val === '__manual__') {
        mb.style.display = 'block';
        tip.style.display = 'none';
      } else {
        mb.style.display = 'none';
        document.getElementById('ssid').value = val;
        const ap = scanData.find(x => x.ssid === val);
        if (ap && ap.auth === 'OPEN') {
          tip.innerText = '● 该网络为开放免密网络，密码可留空直接连接';
          tip.style.display = 'block';
          document.getElementById('psk').value = '';
        } else {
          tip.style.display = 'none';
        }
      }
    }

    function connectWifi() {
      let s = document.getElementById('wifiSelect').value;
      if (s === '__manual__' || !s) {
        s = document.getElementById('ssid').value.trim();
      }
      if (!s) {
        alert('请先选择或输入 Wi-Fi 名称！');
        return;
      }
      const p = document.getElementById('psk').value;
      document.getElementById('msg').innerHTML = '⏳ 正在连接 Wi-Fi [' + s + ']，请稍候...';

      fetch('/api/wifi/connect', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ssid: s, psk: p})
      }).then(r => r.json()).then(d => {
        document.getElementById('msg').innerHTML = '✅ 联网指令已下发！设备正在获取局域网 IP。<br>请将电脑/手机连入同一 Wi-Fi，访问小屏显示的 IP 进入伴侣看板配置 Agent！';
      }).catch(e => {
        document.getElementById('msg').innerHTML = '⚠️ 网络请求已提交，设备正在切换并连入局域网。';
      });
    }

    scanWifi();
  </script>
</body>
</html>
