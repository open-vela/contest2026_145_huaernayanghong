    <div class="card-title">⚙️ 云端大模型 (LLM) 与端云引擎配置</div>
    <span class="status-badge" id="cfgStatusBadge">端侧热加载</span>
  </div>

  \x3C!-- 一键服务商预设 -->
  <div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:8px;">一键填入主流大模型服务商预设 (点击即自动配置 URL 与模型名):</div>
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:16px;">
    <div class="preset-card" data-llm-preset="deepseek">
      <div style="font-weight:bold; color:var(--accent); font-size:12.5px;">🔹 DeepSeek 官方</div>
      <div style="font-size:11px; color:var(--muted); margin-top:3px;">deepseek-chat (V3 / R1)</div>
    </div>
    <div class="preset-card" data-llm-preset="siliconflow">
      <div style="font-weight:bold; color:var(--accent-sub); font-size:12.5px;">⚡ 硅基流动 SiliconFlow</div>
      <div style="font-size:11px; color:var(--muted); margin-top:3px;">deepseek-ai/DeepSeek-V3</div>
    </div>
    <div class="preset-card" data-llm-preset="ollama">
      <div style="font-weight:bold; color:#f1fa8c; font-size:12.5px;">🦙 本地 Ollama / 私有反代</div>
      <div style="font-size:11px; color:var(--muted); margin-top:3px;">http://192.168.x.x:11434</div>
    </div>
    <div class="preset-card" data-llm-preset="openai">
      <div style="font-weight:bold; color:#ff79c6; font-size:12.5px;">🌐 OpenAI / 兼容网关</div>
      <div style="font-size:11px; color:var(--muted); margin-top:3px;">gpt-4o-mini 或兼容聚合</div>
    </div>
  </div>

  \x3C!-- 详细字段表单 -->
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; margin-bottom:14px;">

      <div style="font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;">大模型 API Endpoint (Base URL):</div>
      <input id="baseUrl" type="text" placeholder="如 https://api.deepseek.com/v1/chat/completions">
    </div>
    <div>
      <div style="font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;">大模型模型名称 (Model):</div>
      <input id="modelName" type="text" placeholder="如 deepseek-chat 或 deepseek-ai/DeepSeek-V3">
    </div>
  </div>

  <div style="margin-bottom:14px;">
    <div style="font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;">大模型 API Key (云端密钥):</div>
    <div style="display:flex; gap:8px;">
      <input id="apiKey" type="password" placeholder="输入云端 API Key (如 sk-xxxx)">
      <button class="btn-secondary" style="white-space:nowrap; padding:0 12px;" id="toggleKeyBtn">👁️ 显示</button>
      <button class="btn-secondary" style="white-space:nowrap; padding:0 14px; color:var(--accent-sub); border-color:#235a46;" id="pingTestBtn">⚡ 测试连通性</button>
    </div>
    <div id="pingResultBadge" style="margin-top:6px; font-size:12px; display:none;"></div>
  </div>

  \x3C!-- 人设与系统提示词预设 -->
  <div style="margin-bottom:14px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <div style="font-size:12px; color:var(--muted); font-weight:600;">Agent 系统人设提示词 (System Prompt):</div>
      <div style="display:flex; gap:6px;">
        <span class="chip" data-prompt-template="geek" style="font-size:10.5px;">极客助手</span>
        <span class="chip" data-prompt-template="pet" style="font-size:10.5px;">毒舌萌宠</span>
        <span class="chip" data-prompt-template="study" style="font-size:10.5px;">考研督导</span>
      </div>
    </div>
    <textarea id="agentPrompt" rows="3" placeholder="如：你是一个贴心的赛博桌面极客助手，语气温和简短"></textarea>
  </div>

  \x3C!-- 创造力温度 -->
  <div style="background:var(--card-inner); padding:10px 14px; border-radius:8px; border:1px solid var(--border-light); margin-bottom:18px;">
    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;">
      <span style="color:var(--muted)">生成创造力温度 (Temperature):</span>
      <b id="tempTxt" style="color:var(--accent-sub);">0.7</b>
    </div>
    <input type="range" id="tempRange" min="10" max="100" value="70">
  </div>
</div>

\x3C!-- ASR 语音转文本模型配置卡片 -->

    <div id="asrTestResult" style="background:#05080f; padding:10px; border-radius:6px; font-family:var(--font-mono); font-size:12px; color:#8be9fd; min-height:36px; border:1px solid #1c2a44;">点击上方 "立即执行转写测试" 验证端云 ASR 识别通路...</div>
  </div>

\x3C!-- TTS 文本转语音模型配置卡片 -->

`,ye=`<div class="card highlight">
  <div class="card-head">
    <div class="card-title">📁 外置 MicroSD / TF 卡存储系统</div>
    <span class="status-badge" id="sdcardMountBadge">探测中...</span>
  </div>

  \x3C!-- 容量进度条 -->
  <div style="background:var(--card-inner); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:16px;">
    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
      <span style="color:var(--muted)">挂载目录: <b id="sdcardMountPoint" style="color:var(--accent)">/mnt/sdcard</b></span>
      <span style="color:var(--muted)">已用: <b id="sdcardUsedPct" style="color:var(--accent-sub)">--%</b> (<span id="sdcardUsedMb">0</span> MB / <span id="sdcardTotalMb">0</span> MB)</span>
    </div>
    <div style="height:8px; background:#141c2c; border-radius:4px; overflow:hidden;">
      <div id="sdcardProgressBar" style="width:0%; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-sub)); transition:width 0.4s ease;"></div>
    </div>
    <div style="display:flex; gap:12px; margin-top:10px; font-size:11px; color:var(--muted);">
      <span>📌 持久配置: <code id="dataBaseDir" style="color:#9bc0e7">/data/phoenix</code></span>
      <span>⚡ 中间分片: <code id="tempBaseDir" style="color:#9bc0e7">/tmp/phoenix</code></span>
    </div>
  </div>

  \x3C!-- 目录导航与路径跳转 -->
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-size:12px; color:var(--muted)">当前路径:</span>
      <code id="currentPathDisplay" style="background:#182842; color:var(--accent); padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;">/</code>
      <button class="btn-secondary" id="btnSdcardGoUp" style="margin:0; padding:4px 10px; font-size:11px;">⬆️ 上一级</button>
      <button class="btn-secondary" id="btnSdcardRefresh" style="margin:0; padding:4px 10px; font-size:11px;">🔄 刷新</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-secondary" data-quick-path="/sounds" style="margin:0; padding:4px 10px; font-size:11px;">🎵 sounds</button>
      <button class="btn-secondary" data-quick-path="/logs" style="margin:0; padding:4px 10px; font-size:11px;">📜 logs</button>
      <button class="btn-secondary" data-quick-path="/docs" style="margin:0; padding:4px 10px; font-size:11px;">📑 docs</button>
    </div>
  </div>

  \x3C!-- 文件列表 -->
  <div style="background:var(--card-inner); border:1px solid var(--border); border-radius:8px; max-height:280px; overflow-y:auto; margin-bottom:16px;">
    <table style="width:100%; border-collapse:collapse; font-size:12px; text-align:left;">
      <thead>
        <tr style="border-bottom:1px solid var(--border); color:var(--muted);">
          <th style="padding:8px 12px;">文件名称</th>
          <th style="padding:8px 12px; width:90px;">大小</th>
          <th style="padding:8px 12px; width:120px; text-align:right;">操作</th>
        </tr>
      </thead>
      <tbody id="sdcardFileList">
        <tr><td colspan="3" style="padding:16px; text-align:center; color:var(--muted)">正在读取 TF 卡文件系统...</td></tr>
      </tbody>
    </table>
  </div>

  \x3C!-- 新建与上传 -->
  <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px;">
    <div style="background:var(--card-inner); padding:12px; border-radius:8px; border:1px solid var(--border-light);">
      <div style="font-size:12px; color:var(--accent); font-weight:600; margin-bottom:6px;">📁 新建子目录</div>
      <div style="display:flex; gap:8px;">
        <input id="newDirName" type="text" placeholder="目录名称 (如 music)" style="padding:8px; font-size:12px;">
        <button id="btnSdcardMkdir" style="margin:0; padding:8px 14px; font-size:12px; white-space:nowrap;">新建</button>
      </div>
    </div>
    <div style="background:var(--card-inner); padding:12px; border-radius:8px; border:1px solid var(--border-light);">
      <div style="font-size:12px; color:var(--accent-sub); font-weight:600; margin-bottom:6px;">✍️ 写入文本 / 上传文件</div>
      <input id="uploadFileName" type="text" placeholder="目标文件名 (如 memo.txt)" style="padding:8px; font-size:12px; margin-bottom:6px;">
      <textarea id="uploadFileContent" rows="2" placeholder="输入文件文本内容..." style="margin-bottom:6px; resize:none;"></textarea>
      <div style="display:flex; gap:8px;">
        <input type="file" id="localFileInput" style="display:none;">
        <button class="btn-secondary" id="btnSelectLocalFile" style="margin:0; padding:6px 12px; font-size:11px;">📂 选本地文件</button>
        <button id="btnUploadText" style="margin:0; padding:6px 12px; font-size:11px; flex:1;">🚀 保存并写入 TF 卡</button>
      </div>
    </div>
  </div>
</div>
